apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-cloud-app
  namespace: campus-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-cloud-app
  template:
    metadata:
      labels:
        app: campus-cloud-app
    spec:
      hostAliases:
        - ip: "172.25.0.1"
          hostnames:
            - "host.k3d.internal"
      containers:
        - name: app
          image: campus-cloud-reference:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: campus-cloud-config
            - secretRef:
                name: campus-cloud-secret
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
